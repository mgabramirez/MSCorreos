# ============================================================
# Base de datos PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_correos
spring.datasource.username=administradores
spring.datasource.password=@dm1n$t0d0c0mPU$
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# Servidor
# ============================================================
server.port=8080

# ============================================================
# API Key para autenticación de endpoints REST (Requirements 13.1, 13.5)
# Cambiar este valor en producción por una clave segura
# ============================================================
mscorreos.api.key=mscorreos-api-key-change-in-production

# ============================================================
# Logging
# ============================================================
logging.level.com.acosux.MSCorreos=INFO
logging.level.org.springframework.security=WARN
