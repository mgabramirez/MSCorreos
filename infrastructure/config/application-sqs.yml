      standard:
        name: mscorreos-standard-test
        url: ${STANDARD_QUEUE_URL:https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID/mscorreos-standard-test}
      fifo:
        name: mscorreos-alta-prioridad-test.fifo
        url: ${FIFO_QUEUE_URL:https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID/mscorreos-alta-prioridad-test.fifo}
      dlq:
        name: mscorreos-dlq-test
        url: ${DLQ_URL:https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID/mscorreos-dlq-test}

---
# Ambiente de producción
spring:
  config:
    activate:
      on-profile: prod

aws:
  sqs:
    queue:
      standard:
        name: mscorreos-standard-prod
        url: ${STANDARD_QUEUE_URL:https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID/mscorreos-standard-prod}
      fifo:
        name: mscorreos-alta-prioridad-prod.fifo
        url: ${FIFO_QUEUE_URL:https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID/mscorreos-alta-prioridad-prod.fifo}
